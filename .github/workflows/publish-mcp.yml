# Publish projects-manager-mcp to npm when you push a tag: mcp-v1.2.3
# Requires repo secret: NPM_TOKEN (Automation token from npmjs.com)

name: Publish MCP package

on:
  push:
    tags:
      - 'mcp-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'npm publish --dry-run only'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/projects-manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        run: |
          TAG="${GITHUB_REF_NAME#mcp-v}"
          npm version "$TAG" --no-git-tag-version --allow-same-version

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --dry-run
          else
            npm publish --access public
          fi
