<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Projects Manager — family projects, tasks, and GitHub sync" />
    <meta name="theme-color" content="#212529" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)" />
    <title>Projects Manager</title>
    <!--
      Unregister leftover PWA workers before the app loads.
      (Old vite-plugin-pwa deploys left SWs that cache shells so simple refresh never updates.)
    -->
    <script>
      ;(function () {
        if (!('serviceWorker' in navigator)) return
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) {
            r.unregister()
          })
        })
        if (typeof caches !== 'undefined') {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) {
              caches.delete(k)
            })
          })
        }
      })()
    </script>
    <!-- Bootstrap Icons (same family as classic Flask UI) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Sketchy-friendly display font (Bootswatch Sketchy uses Neucha-like feel) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Neucha&family=Cabin+Sketch:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
